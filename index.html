<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #555;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
        }

        /* Mobile responsive styles */
        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            nav a {
                display: inline-block;
                margin: 5px 10px;
                font-size: 0.9rem;
            }

            main {
                margin: 15px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h2>Welcome</h2>

        <p>
            Welcome to my first multi-page website built using HTML and basic CSS.
            This project demonstrates navigation between pages and a contact form.
        </p>
    </main>

</body>
</html>
